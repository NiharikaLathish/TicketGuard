services:
  cassandra:
    image: cassandra:4.1
    container_name: ticketguard-cassandra
    ports: ["9042:9042"]
    environment:
      CASSANDRA_CLUSTER_NAME: TicketGuard
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    container_name: ticketguard-neo4j
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ticketguard123}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 1G
    volumes: [neo4j_data:/data]
volumes:
  cassandra_data:
  neo4j_data:
